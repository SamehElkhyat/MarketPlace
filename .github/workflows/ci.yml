name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Integration tests boot MongoDB (a replica set, needed for transactions) in memory — no service container.
      - run: npm test

  bundle:
    name: Committed Vercel bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # api/_app.js is committed on purpose; fail if someone changed the source without rebuilding it.
      - name: Fail if api/_app.js is stale
        run: git diff --exit-code -- api/_app.js
