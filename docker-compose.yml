# Local development services only — production runs on Vercel + Atlas + managed services.
#   docker compose up -d
services:
  mongo:
    image: mongo:7
    # Single-node replica set: required for multi-document transactions (checkout, stock, cancellations).
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --port 27017 --eval "
        try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  # Catches every e-mail the API sends. Inbox UI: http://localhost:8025 (SMTP on :1025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
